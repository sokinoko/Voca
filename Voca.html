<style>
:root{
  --paper:#FBFAF7; --ink:#16181C; --graphite:#565C66; --rule:#DEDAD1;
  --red:#D33227; --redsoft:#F4D9D6; --mark:#1B1D22; --yellow:#FBE9A6;
  --serif:"Times New Roman",Times,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;padding-bottom:80px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

header{border-bottom:3px double var(--ink);padding:14px 0 8px;margin-bottom:12px}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.appicon{width:26px;height:26px;vertical-align:-5px;margin-right:7px;border-radius:6px}
h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:0;letter-spacing:-.3px}
h1 em{font-style:normal;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--graphite);margin-left:8px}
.meter{font-size:12px;color:var(--graphite);white-space:nowrap;text-align:right}
.meter b{font-family:var(--serif);font-size:17px;color:var(--ink)}
.meter .st{color:var(--red);font-weight:700}
.bar{height:4px;background:var(--rule);margin-top:7px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--mark);width:0;transition:width .3s}

.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.seg{display:flex;border:1px solid var(--ink)}
.seg button{font:inherit;font-size:12.5px;padding:5px 10px;background:transparent;border:0;
  border-right:1px solid var(--rule);cursor:pointer;color:var(--graphite)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:600}
.chip{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--rule);background:transparent;
  cursor:pointer;color:var(--graphite)}
.chip[aria-pressed=true]{border-color:var(--red);color:var(--red);font-weight:700;background:#fff}
select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--ink);background:#fff;
  flex:1;min-width:150px;border-radius:0}
input[type=search]{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--rule);
  background:#fff;min-width:130px;flex:1}
input[type=search]:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.count{font-size:12px;color:var(--graphite);padding:2px 0;width:100%}
.count b{color:var(--ink)}

table{width:100%;border-collapse:collapse}
tr.row{border-bottom:1px solid var(--rule)}
td{padding:9px 4px;vertical-align:top}
.tdnum{width:30px;font-family:var(--serif);font-size:12px;color:#9aa0aa;text-align:right;padding-right:8px}
.word{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:-.2px}
.pos{font-family:var(--sans);font-size:10.5px;color:var(--red);font-weight:600;margin-left:5px}
.chunk{font-family:var(--serif);font-style:italic;font-size:13.5px;color:#2c3037;margin-top:4px}
.chunk u{text-decoration-thickness:1.5px;text-underline-offset:3px;font-weight:700;font-style:normal}
.src{font-size:10.5px;color:var(--graphite);margin-top:3px}
.exwrap{margin-top:6px;padding-left:8px;border-left:2px solid var(--rule)}
.csrc{text-align:center;font-size:10.5px;color:var(--graphite);margin:-10px 0 14px}
.src .tg{color:var(--red);font-weight:700}
.mask{margin-top:3px;position:relative;display:inline-block;max-width:100%}
.mean{font-size:13.5px}
.tr{font-size:12.5px;color:#3f454e}
.mask.hide{color:transparent;background:var(--redsoft);box-shadow:0 0 0 3px var(--redsoft);
  cursor:pointer;border-radius:1px}
.mask.hide::after{content:"가림판";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--red);font-size:10.5px;font-weight:700;letter-spacing:1px}
.mask.hide u{text-decoration:none}
.omr{width:96px;text-align:right;white-space:nowrap}
.dot{width:19px;height:19px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;
  margin-left:3px;cursor:pointer;padding:0;font:inherit;font-size:9px;color:transparent;
  transition:background .12s;vertical-align:middle}
.dot.on{background:var(--mark)}
.star{font:inherit;font-size:19px;line-height:1;background:none;border:0;cursor:pointer;
  color:#c3c7cd;padding:0 4px 0 0;vertical-align:middle}
.star.on{color:var(--red)}

.card{border:1px solid var(--ink);background:#fff;padding:26px 20px 20px;margin-top:6px;position:relative}
.card .no{position:absolute;top:0;left:0;background:var(--ink);color:var(--paper);
  font-size:11px;padding:3px 9px}
.card .tag{position:absolute;top:6px;right:44px;font-size:11px;color:var(--red);font-weight:700}
.card .star{position:absolute;top:2px;right:10px;font-size:23px}
.card .cw{font-family:var(--serif);font-size:34px;font-weight:700;text-align:center;
  margin:26px 0 4px;letter-spacing:-.5px;word-break:break-word}
.card .cp{text-align:center;font-size:12px;color:var(--red);font-weight:600}
.card .cc{font-family:var(--serif);font-style:italic;text-align:center;color:#2c3037;
  margin:16px 0 6px;font-size:16px}
.card .cc u{text-decoration-thickness:1.5px;text-underline-offset:3px;font-weight:700;font-style:normal}
.card .ct{text-align:center;font-size:13px;color:#3f454e;margin-bottom:16px;min-height:19px}
.card .cm{text-align:center;font-size:19px;min-height:30px;padding:10px 0;
  border-top:1px dashed var(--rule)}
.card .cm.hide,.card .ct.hide{color:transparent;background:var(--redsoft);border-radius:1px}
.cbtns{display:flex;gap:8px;margin-top:14px}
.cbtns button{flex:1;font:inherit;font-size:14px;padding:12px;border:1px solid var(--ink);
  background:transparent;cursor:pointer}
.cbtns button.solid{background:var(--ink);color:var(--paper);font-weight:600}
.cbtns button.warn{border-color:var(--red);color:var(--red)}
.cstat{text-align:center;font-size:12px;color:var(--graphite);margin-top:10px}

.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14px;padding:11px 12px;
  margin-top:7px;border:1px solid var(--rule);background:#fff;cursor:pointer}
.opt .n{font-family:var(--serif);color:var(--graphite);margin-right:8px}
.opt.right{border-color:var(--ink);background:var(--yellow)}
.opt.wrong{border-color:var(--red);color:var(--red)}

.grp{margin:22px 0 0}
.grp h3{font-family:var(--sans);font-size:15px;margin:0 0 4px;padding-left:9px;
  border-left:4px solid var(--red);line-height:1.35}
.grp .gd{font-size:12.5px;color:var(--graphite);margin:0 0 6px;padding-left:13px;line-height:1.6}
.ax{border-bottom:1px solid var(--rule);padding:8px 2px}
.axh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.exp{font-family:var(--serif);font-size:16px;font-weight:700}
.hit{font-size:10.5px;color:var(--red);font-weight:700;white-space:nowrap}
.new{font-size:10.5px;color:#9aa0aa;white-space:nowrap}
.axm{font-size:13.5px}
.grp h3 .cnt{font-size:12px;color:var(--graphite);font-weight:400;margin-left:4px}
.badges{white-space:nowrap}
.badges .new{margin-left:5px}
.axe{font-family:var(--serif);font-style:italic;font-size:13.5px;color:#2c3037;margin-top:5px}
.axt{font-size:12.5px;color:#3f454e}
.axn{font-size:12px;color:var(--graphite);margin-top:3px;line-height:1.55}
.poly{border-top:1px solid var(--rule);padding:12px 2px}
.poly h3{font-family:var(--serif);font-size:19px;margin:0 0 4px}
.poly .pm{font-size:13.5px}
.poly .py{font-size:12.5px;color:var(--graphite);margin-top:4px;line-height:1.55}

.empty{text-align:center;color:var(--graphite);font-size:13.5px;padding:50px 0}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1px solid var(--ink);padding:7px 14px calc(7px + env(safe-area-inset-bottom))}
.foot .inner{max-width:820px;margin:0 auto;display:flex;gap:6px;align-items:center}
.foot .seg{flex:1}.foot .seg button{flex:1;padding:5px 4px;font-size:12px}
.reset{font:inherit;font-size:11.5px;color:var(--graphite);background:none;border:0;
  text-decoration:underline;cursor:pointer;padding:4px}
.sheet{margin-top:10px}
.sh{border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.sht{font-family:var(--serif);font-size:19px;font-weight:700}
.sht span{float:right;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--graphite)}
.shs{font-size:11.5px;color:var(--graphite);margin-top:4px}
.qs-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.q{padding:7px 0;border-bottom:1px dotted var(--rule)}
.qt{font-size:13px}
.qn{color:var(--graphite);font-size:11.5px;margin-right:4px}
.qw{font-family:var(--serif);font-size:15.5px;font-weight:700}
.qs{font-size:10px;color:#9aa0aa;margin-left:5px}
.ax-q .pos{color:#8a8f98}
.ql{height:17px;border-bottom:1px solid var(--rule);margin-top:3px}
.ansbox{margin-top:26px;border-top:3px double var(--ink);padding-top:10px;font-size:12px}
.ansbox .sh{border-bottom:1px solid var(--rule)}
.ansgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 12px;margin-top:6px}
.an{color:#3f454e;font-size:11.5px}
.an b{font-family:var(--serif);color:var(--ink);margin-right:3px}
@media print{
  body{padding:0;background:#fff}
  header,.foot,.controls,.count,.noprint{display:none!important}
  .sheet{margin:0}
  .q{break-inside:avoid}
  .ql{border-bottom:1px solid #999}
  .ansbox{page-break-before:always;border-top:0;margin-top:0}   /* 정답지는 항상 새 장 */
  body.pq .ansbox{display:none!important}                        /* 시험지만 */
  body.pa .sheet{display:none!important}                         /* 정답지만 */
  body.pa .ansbox{page-break-before:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .src{font-size:11px}.word{font-size:16px}.chunk{font-size:12.5px}.tr{font-size:11.5px}
  .tdnum{display:none}.omr{width:88px}
  .qs-wrap{grid-template-columns:1fr}
  .ansgrid{grid-template-columns:repeat(2,1fr)}
}
</style>

대조 — 글의 방향이 꺾이는 자리", "g": "이 표시가 나오면 그 뒤 문장이 필자의 주장일 확률이 가장 높습니다. 빈칸·주제 문제의 근거는 거의 여기서 나옵니다.", "r": [{"e": "however", "m": "그러나", "n": "앞 내용을 뒤집는다. 문장 중간에 콤마로 끼어드는 형태도 자주 나온다", "s": "6월 20·31번, 9월 18·20번", "x": "However, participants' minds determine their attitudes.", "xt": "그러나 참여자의 마음이 그들의 태도를 결정한다."}, {"e": "but instead", "m": "그 대신에", "n": "앞을 부정하고 대안을 제시. instead 뒤가 핵심", "s": "6월 30번", "x": "not let the form get in the way, but instead see it as a technique", "xt": "형식이 방해하게 두지 말고, 그 대신 그것을 기법으로 보라"}, {"e": "instead", "m": "대신에", "n": "앞 문장의 방법을 버리고 새 방법으로", "s": "6월 듣기 3번", "x": "Instead, if you shorten your steps, your body moves naturally forward.", "xt": "대신에, 보폭을 줄이면 몸이 자연스럽게 앞으로 나아간다."}, {"e": "rather (than)", "m": "오히려 / ~보다는", "n": "A rather than B에서 필자가 미는 쪽은 A", "s": "6월 31번, 9월 38번", "x": "rather than interfering as minimally as possible", "xt": "가능한 한 최소한으로만 개입하기보다는"}, {"e": "yet (접속사)", "m": "그러나, 그런데도", "n": "but의 문어체. 문장 중간의 yet을 '아직'으로 읽으면 해석이 꼬인다", "s": "6월 37번, 9월 23번", "x": "writers feel bound by the rules yet need to show originality", "xt": "작가들은 규칙에 얽매인다고 느끼면서도 독창성을 보여야 한다"}, {"e": "nonetheless", "m": "그럼에도 불구하고", "n": "양보 후 반전. nevertheless와 같은 뜻", "s": "6월 31번", "x": "Preservationists may nonetheless call themselves conservationists.", "xt": "보존론자들은 그럼에도 스스로를 보호론자라 부를 수도 있다."}, {"e": "while / whereas", "m": "~인 반면에", "n": "대조를 만드는 접속사. 문두 while을 '~하는 동안'으로만 읽지 말 것", "s": "9월 29·33번", "x": "While a picture transports the spectator instantly, language describes detail by detail.", "xt": "그림은 관객을 즉시 데려가는 반면, 언어는 하나하나 묘사한다."}, {"e": "Nor + 도치", "m": "~도 (역시) 아니다", "n": "Nor are individual plants… 처럼 주어·동사가 뒤집힌다", "s": "6월 36번", "x": "Nor are individual plants entirely on their own while under attack.", "xt": "공격받는 동안 개별 식물이 전적으로 혼자인 것도 아니다."}, {"e": "Not that ~", "m": "~라는 것은 아니다", "n": "앞의 오해를 미리 차단하는 표현", "s": "6월 39번", "x": "Not that they did not exist, but they had to wait a long time.", "xt": "그것들이 존재하지 않았다는 게 아니라, 오랫동안 기다려야 했다는 것이다."}, {"e": "nevertheless", "m": "그럼에도 불구하고", "n": "", "s": "추가", "x": "The evidence was weak; nevertheless, the theory spread quickly.", "xt": "증거는 빈약했다. 그럼에도 그 이론은 빠르게 퍼졌다."}, {"e": "in contrast / by contrast", "m": "그에 반해", "n": "", "s": "추가", "x": "In contrast, larger animals can afford slower reflexes.", "xt": "그에 반해 더 큰 동물은 더 느린 반사 신경으로도 괜찮다."}, {"e": "on the contrary", "m": "(그와) 반대로", "n": "앞 내용을 정면으로 부정", "s": "추가", "x": "The plan did not fail. On the contrary, it worked better than expected.", "xt": "그 계획은 실패하지 않았다. 오히려 예상보다 잘되었다."}, {"e": "conversely", "m": "반대로", "n": "앞 명제의 역을 제시", "s": "추가", "x": "Conversely, longer-lived animals rely more on learning.", "xt": "반대로, 오래 사는 동물은 학습에 더 의존한다."}, {"e": "on the other hand", "m": "다른 한편으로는", "n": "", "s": "추가", "x": "On the other hand, too much choice can paralyze buyers.", "xt": "다른 한편으로, 선택지가 너무 많으면 구매자는 결정을 못 한다."}, {"e": "far from -ing", "m": "결코 ~이 아닌", "n": "far from solving = 해결하기는커녕", "s": "추가", "x": "Far from solving the problem, the policy made it worse.", "xt": "그 정책은 문제를 해결하기는커녕 더 악화시켰다."}, {"e": "if anything", "m": "오히려", "n": "약한 반전 신호", "s": "추가", "x": "The new data did not weaken his case; if anything, it strengthened it.", "xt": "새 자료는 그의 주장을 약화시키지 않았다. 오히려 강화했다."}]}, {"t": "2. 인과 · 결과 — 논리의 방향을 정하는 자리", "g": "원인과 결과 중 어느 쪽이 앞에 오는지만 정확히 잡으면 순서·삽입 문제가 쉬워집니다.", "r": [{"e": "thus", "m": "따라서, 그리하여", "n": "앞 문장의 논리적 귀결", "s": "6월 37번", "x": "Thus anyone deploying spectacle may draw on earlier conventions.", "xt": "따라서 장관을 전개하는 사람은 이전의 관습을 활용할 수 있다."}, {"e": "hence", "m": "그러므로", "n": "thus와 같지만 더 격식체", "s": "9월 40번", "x": "Hence, a less-revealing image may suit the dramatic action better.", "xt": "따라서 덜 드러내는 이미지가 극적 행위에 더 어울릴 수 있다."}, {"e": "therefore", "m": "그러므로", "n": "", "s": "9월 35번", "x": "Cultural tourists rarely return, and therefore they keep looking for new attractions.", "xt": "문화 관광객은 좀처럼 재방문하지 않고, 따라서 계속 새로운 볼거리를 찾는다."}, {"e": "as a result (of)", "m": "그 결과 (~의 결과로)", "n": "", "s": "6월 23번, 9월 35번", "x": "As a result, being short-lived puts a premium on preprogrammed behavior.", "xt": "그 결과, 수명이 짧다는 것은 미리 프로그램된 행동을 중시하게 만든다."}, {"e": "thereby -ing", "m": "그렇게 함으로써 ~하다", "n": "주절의 행위가 곧 원인. 요약문에 자주 등장", "s": "6월 40번", "x": "AI can reduce the imbalance, thereby broadening the focus of research.", "xt": "AI는 불균형을 줄이고, 그렇게 함으로써 연구의 초점을 넓힐 수 있다."}, {"e": "so that", "m": "~하도록 / 그 결과 ~하다", "n": "목적인지 결과인지는 콤마 유무와 문맥으로 판단", "s": "6월 29번", "x": "Upperclass styles were used so that their wearers' roles could be identified.", "xt": "상류층 스타일은 착용자의 역할이 식별될 수 있도록 사용되었다."}, {"e": "so ~ that …", "m": "너무 ~해서 …하다", "n": "so pronounced that laws were enacted", "s": "6월 29번", "x": "The connection was so pronounced that laws were enacted.", "xt": "그 연관성이 너무 뚜렷해서 법이 제정되었다."}, {"e": "since (이유)", "m": "~이므로", "n": "문두 since는 시간보다 이유인 경우가 많다", "s": "9월 35번", "x": "A selection takes place since only a few buildings can be adapted.", "xt": "소수의 건물만 (관광에) 맞출 수 있으므로 선별이 일어난다."}, {"e": "due to / owing to", "m": "~ 때문에", "n": "뒤에 명사가 온다 (because of와 동일)", "s": "9월 듣기 9번", "x": "Due to our recent regulation changes, you cannot take your pets.", "xt": "최근의 규정 변경으로 인해 반려동물을 데려올 수 없습니다."}, {"e": "given (that)", "m": "~을 고려하면", "n": "given the way it behaves", "s": "6월 41-42번", "x": "Given the way it behaves, glass is in practice a liquid.", "xt": "그것이 움직이는 방식을 고려하면, 유리는 실제로는 액체이다."}, {"e": "lead to / result in", "m": "~을 초래하다", "n": "result from(~에서 비롯되다)과 방향이 반대", "s": "6월 듣기 2번, 9월 37번", "x": "Crossing the families would result in salmon that grew faster.", "xt": "그 계통들을 교배하면 더 빨리 자라는 연어가 나오게 된다."}, {"e": "give rise to", "m": "~을 야기하다", "n": "", "s": "6월 38번", "x": "The difference in pressures gives rise to vortices.", "xt": "압력 차이가 회오리바람을 야기한다."}, {"e": "consequently", "m": "결과적으로", "n": "", "s": "추가", "x": "He missed the deadline; consequently, his application was rejected.", "xt": "그는 마감을 놓쳤고, 결과적으로 지원서가 거절되었다."}, {"e": "accordingly", "m": "그에 따라서", "n": "", "s": "추가", "x": "The rules changed, and the team adjusted its plan accordingly.", "xt": "규칙이 바뀌었고 팀은 그에 따라 계획을 조정했다."}, {"e": "in that", "m": "~라는 점에서", "n": "이유를 한정", "s": "추가", "x": "The two studies differ in that only one used a control group.", "xt": "두 연구는 하나만 대조군을 썼다는 점에서 다르다."}, {"e": "on account of", "m": "~ 때문에", "n": "", "s": "추가", "x": "The event was delayed on account of heavy rain.", "xt": "그 행사는 폭우 때문에 연기되었다."}]}, {"t": "3. 첨가 · 부연 — 같은 방향으로 한 걸음 더", "g": "앞 문장과 같은 논지가 이어진다는 신호. 순서 배열에서 '이미 나온 내용의 연장'임을 알려 줍니다.", "r": [{"e": "in addition", "m": "게다가, 또한", "n": "", "s": "6월 듣기 9번, 9월 35번", "x": "In addition, cultural tourists do not often repeat their visit.", "xt": "게다가 문화 관광객은 같은 곳을 자주 재방문하지 않는다."}, {"e": "further (문두 부사)", "m": "더욱이", "n": "'더 멀리'가 아니라 '게다가'", "s": "6월 23번", "x": "Further, decision making must be streamlined in small species.", "xt": "더욱이, 작은 종에서는 의사결정이 간소화되어야 한다."}, {"e": "furthermore", "m": "더 나아가, 게다가", "n": "", "s": "9월 20번", "x": "Furthermore, our efforts will support social integration.", "xt": "더 나아가 우리의 노력은 사회 통합을 뒷받침할 것이다."}, {"e": "likewise / similarly", "m": "마찬가지로", "n": "앞의 사례와 같은 원리의 두 번째 사례", "s": "6월 38번, 9월 32번", "x": "Likewise, your reaction is greater if your eyes are closed.", "xt": "마찬가지로, 눈을 감고 있으면 당신의 반응은 더 커진다."}, {"e": "and, perhaps most important,", "m": "그리고 아마 가장 중요한 것은", "n": "필자가 직접 순위를 매기는 자리", "s": "6월 23번", "x": "And, perhaps most important, a short lifetime offers little time for learning.", "xt": "그리고 아마 가장 중요한 것은, 짧은 수명은 배울 시간을 거의 주지 않는다는 점이다."}, {"e": "not only A but also B", "m": "A뿐 아니라 B도", "n": "B가 무게중심", "s": "6월 34번, 9월 20·32번", "x": "It will not only promote personal growth but also sustain productivity.", "xt": "그것은 개인의 성장을 촉진할 뿐 아니라 생산성도 유지할 것이다."}, {"e": "moreover", "m": "더욱이", "n": "", "s": "추가", "x": "Moreover, the method costs far less than the old one.", "xt": "더욱이 그 방법은 예전 것보다 비용이 훨씬 적게 든다."}, {"e": "besides", "m": "게다가", "n": "전치사(~ 외에)와 부사(게다가)를 구분", "s": "추가", "x": "Besides, no one had tested the device outdoors.", "xt": "게다가 아무도 그 장치를 야외에서 시험해 보지 않았다."}, {"e": "what is more", "m": "더군다나", "n": "", "s": "추가", "x": "What is more, the results were repeated in three labs.", "xt": "더군다나 그 결과는 세 곳의 실험실에서 재현되었다."}, {"e": "above all", "m": "무엇보다도", "n": "", "s": "추가", "x": "Above all, the reader must not lose the sense of orientation.", "xt": "무엇보다도 독자는 방향 감각을 잃어서는 안 된다."}, {"e": "not to mention", "m": "~은 말할 것도 없고", "n": "", "s": "추가", "x": "The trip was long, not to mention expensive.", "xt": "그 여행은 길었고, 비쌌던 것은 말할 것도 없다."}]}, {"t": "4. 예시 · 환언 — 추상을 구체로 바꾸는 자리", "g": "빈칸이 추상적일 때, 바로 뒤 예시가 정답의 근거가 됩니다. 예시를 일반화하면 곧 답입니다.", "r": [{"e": "for example", "m": "예를 들어", "n": "", "s": "6월 20·31·37번", "x": "For example, an instructor could explain how warming up improves performance.", "xt": "예를 들어 지도자는 준비 운동이 어떻게 수행을 향상시키는지 설명할 수 있다."}, {"e": "for instance", "m": "예를 들어", "n": "", "s": "9월 39번", "x": "For instance, too many timbre variations may distract attention.", "xt": "예를 들어 음색 변화가 너무 많으면 주의가 흩어질 수 있다."}, {"e": "such as", "m": "~와 같은", "n": "", "s": "6월 30번, 9월 38번", "x": "decorations such as feathers, silk, or velvet", "xt": "깃털, 비단, 벨벳 같은 장식들"}, {"e": "that is / i.e.", "m": "즉, 다시 말해", "n": "앞말을 더 쉬운 말로 바꿔 준다", "s": "6월 40번, 9월 41-42번", "x": "the group that expressed no concerns about (i.e., believed) the claims", "xt": "그 주장에 대해 우려를 표하지 않은, 즉 그것을 믿은 집단"}, {"e": "in other words", "m": "다시 말해서", "n": "", "s": "추가", "x": "In other words, the brain treats exclusion as a threat.", "xt": "다시 말해 뇌는 배제를 위협으로 취급한다."}, {"e": "namely", "m": "즉, 다름 아닌", "n": "", "s": "추가", "x": "One factor was ignored, namely the cost of maintenance.", "xt": "한 가지 요인, 즉 유지비가 무시되었다."}, {"e": "say", "m": "이를테면", "n": "문장 중간의 say는 '말하다'가 아니다", "s": "추가", "x": "Choose a short course, say a month, before you commit.", "xt": "결정하기 전에, 이를테면 한 달짜리 짧은 과정을 택해라."}, {"e": "as in", "m": "~에서처럼", "n": "", "s": "추가", "x": "The same word can mean 'colored,' as in coloratus in Latin.", "xt": "라틴어의 coloratus에서처럼 같은 단어가 '색이 있는'을 뜻할 수 있다."}, {"e": "take ~ for example", "m": "~을 예로 들면", "n": "", "s": "추가", "x": "Take hotels, for example: they began to sell more than rooms.", "xt": "호텔을 예로 들면, 그들은 객실 이상의 것을 팔기 시작했다."}]}, {"t": "5. 양보 — '인정하지만 그래도'", "g": "양보절은 항상 버리는 정보, 주절이 살리는 정보입니다. 주절만 읽어도 요지가 잡힙니다.", "r": [{"e": "although / (even) though", "m": "비록 ~이지만", "n": "", "s": "6월 37번, 9월 26번", "x": "Although there may be elements that trigger instinctive response, spectacle works within a cultural frame.", "xt": "본능적 반응을 유발하는 요소가 있을 수는 있지만, 장관은 문화적 틀 안에서 작동한다."}, {"e": "even if", "m": "설령 ~라 하더라도", "n": "가정. even though(사실)와 구분", "s": "6월 40번", "x": "even if a disease is quite prevalent in a population that cannot pay", "xt": "어떤 질병이 지불 능력이 없는 집단에 상당히 만연해 있더라도"}, {"e": "despite / in spite of", "m": "~에도 불구하고", "n": "뒤에 명사·동명사", "s": "6월 21·35번", "x": "despite the flourishing of neuroscience, no one had found that part", "xt": "신경과학의 번성에도 불구하고 아무도 그 부분을 찾아내지 못했다"}, {"e": "regardless of", "m": "~에 상관없이", "n": "", "s": "9월 39번", "x": "Regardless of musical style, more focus on one parameter means less on others.", "xt": "음악 양식과 상관없이, 한 요소에 집중이 늘면 다른 요소에는 줄어든다."}, {"e": "whether A or B", "m": "A든 B든", "n": "조건이 아니라 양보", "s": "6월 34·40번, 9월 24번", "x": "whether he buys for himself or as the representative of an institution", "xt": "그가 자신을 위해 사든 기관의 대표로서 사든"}, {"e": "while (양보)", "m": "~이긴 하지만", "n": "While empathy forms in everyone…", "s": "9월 29번", "x": "While empathy forms in everyone to some degree, effective leaders develop it.", "xt": "공감은 누구에게나 어느 정도 형성되지만, 유능한 지도자는 그것을 발전시킨다."}, {"e": "however + 형용사/부사", "m": "아무리 ~하더라도", "n": "however hard he tries", "s": "추가", "x": "However hard he practiced, the sound stayed rough.", "xt": "그가 아무리 열심히 연습해도 소리는 거칠었다."}, {"e": "granted that / admittedly", "m": "인정하건대", "n": "반박을 예고하는 신호", "s": "추가", "x": "Admittedly, the sample was small, but the pattern was clear.", "xt": "인정하건대 표본은 작았지만, 그 양상은 분명했다."}, {"e": "notwithstanding", "m": "~에도 불구하고", "n": "", "s": "추가", "x": "Notwithstanding the risks, the city approved the design.", "xt": "위험에도 불구하고 시는 그 설계를 승인했다."}, {"e": "for all ~", "m": "~에도 불구하고", "n": "for all his efforts", "s": "추가", "x": "For all his talent, he never finished a single piece.", "xt": "그의 재능에도 불구하고 그는 단 한 곡도 끝내지 못했다."}]}, {"t": "6. 조건 · 가정", "g": "'~라면'인지 '~하지 않는 한'인지를 뒤집어 읽으면 정답이 통째로 바뀝니다.", "r": [{"e": "unless", "m": "~하지 않는 한", "n": "if ~ not. 부정을 품고 있으므로 not을 또 붙이지 않는다", "s": "6월 41-42번", "x": "Unless the church has endured high temperatures, the glass is simply uneven.", "xt": "교회가 고온을 견딘 것이 아니라면, 그 유리는 그저 고르지 않은 것이다."}, {"e": "in case of", "m": "~의 경우에 (대비해)", "n": "안내문 단골", "s": "6월 28번", "x": "In case of heavy rain, the event will be cancelled.", "xt": "폭우가 올 경우 그 행사는 취소될 것이다."}, {"e": "otherwise", "m": "그렇지 않으면 / 다른 방식으로", "n": "앞 문장을 뒤집은 가정", "s": "9월 39번", "x": "Avoid contrasting variations; otherwise, the timbre may distract attention.", "xt": "대조되는 변화를 피하라. 그렇지 않으면 음색이 주의를 흩뜨릴 수 있다."}, {"e": "as long as", "m": "~하는 한", "n": "조건. 시간의 '~하는 동안'과 구분", "s": "추가", "x": "You may stay as long as you keep the noise down.", "xt": "소음만 줄인다면 머물러도 좋다."}, {"e": "provided (that)", "m": "~라는 조건이면", "n": "", "s": "추가", "x": "The discount applies provided that you book four people.", "xt": "네 명을 예약한다는 조건이면 할인이 적용된다."}, {"e": "suppose / supposing", "m": "~라고 가정하면", "n": "", "s": "추가", "x": "Suppose the incentive rewarded speed only.", "xt": "그 유인책이 속도만 보상한다고 가정해 보자."}, {"e": "but for / without", "m": "~이 없다면(없었다면)", "n": "가정법의 신호", "s": "추가", "x": "But for her advice, Sally would never have tried the violin.", "xt": "그녀의 조언이 없었다면 Sally는 결코 바이올린을 시도하지 않았을 것이다."}, {"e": "if any / if ever", "m": "있다 해도 (거의 없다)", "n": "few if any = 거의 없다", "s": "추가", "x": "Few plants, if any, are entirely on their own.", "xt": "혼자 힘으로만 버티는 식물은 있다 해도 거의 없다."}, {"e": "had it not been for", "m": "~이 없었더라면", "n": "if가 생략된 도치", "s": "추가", "x": "Had it not been for the coupon, the total would have been higher.", "xt": "그 쿠폰이 없었다면 총액은 더 높았을 것이다."}]}, {"t": "7. 시간 · 순서", "g": "듣기 16~17번과 순서 배열 문제에서 흐름을 잡아 주는 표지입니다.", "r": [{"e": "once (접속사)", "m": "일단 ~하면", "n": "once favorable individuals were found", "s": "9월 37번", "x": "Once favorable individuals were found, a new race could be created quickly.", "xt": "일단 우수한 개체가 발견되자 새로운 품종이 빠르게 만들어질 수 있었다."}, {"e": "until", "m": "~할 때까지 (계속)", "n": "we had to wait until…", "s": "6월 41-42번", "x": "We had to wait until the middle of the twentieth century for flat glass.", "xt": "평평한 유리를 얻기까지 20세기 중반까지 기다려야 했다."}, {"e": "from time to time", "m": "때때로", "n": "", "s": "9월 39번", "x": "A piece of music needs contrasting elements from time to time.", "xt": "음악 작품에는 때때로 대조되는 요소가 필요하다."}, {"e": "first / second / next / finally", "m": "첫째 / 둘째 / 다음으로 / 마지막으로", "n": "듣기 장문(16~17번)의 뼈대", "s": "6월·9월 듣기 16-17번", "x": "First, dogs in France find truffles. Finally, Italy trains dogs as lifeguards.", "xt": "첫째, 프랑스의 개들은 송로버섯을 찾는다. 마지막으로, 이탈리아는 개를 인명 구조원으로 훈련시킨다."}, {"e": "to date / so far", "m": "지금까지", "n": "현재완료와 짝", "s": "6월 40번", "x": "drugs for rare diseases that to date haven't received much attention", "xt": "지금까지 큰 주목을 받지 못한 희귀병 치료제"}, {"e": "eventually / ultimately", "m": "결국, 마침내", "n": "", "s": "추가", "x": "Eventually the wind separates from the face of the building.", "xt": "결국 바람은 건물의 표면에서 분리된다."}, {"e": "subsequently", "m": "그 후에", "n": "", "s": "추가", "x": "The article was written in 1948 and subsequently published in 1957.", "xt": "그 논문은 1948년에 쓰였고 그 후 1957년에 출판되었다."}, {"e": "meanwhile / in the meantime", "m": "그 사이에, 한편", "n": "", "s": "추가", "x": "Meanwhile, the other group was moved to the back of the room.", "xt": "그 사이에 다른 집단은 교실 뒤쪽으로 옮겨졌다."}, {"e": "as soon as", "m": "~하자마자", "n": "", "s": "추가", "x": "As soon as the monorail rose above the clouds, he opened his mouth.", "xt": "모노레일이 구름 위로 올라오자마자 그는 입을 벌렸다."}, {"e": "no sooner A than B", "m": "A하자마자 B하다", "n": "도치를 동반", "s": "추가", "x": "No sooner had he sat down than the woman stopped playing.", "xt": "그가 앉자마자 그 여인은 연주를 멈추었다."}, {"e": "at the same time", "m": "동시에 / 한편으로는", "n": "대조의 뜻으로도 쓰인다", "s": "추가", "x": "The design must be safe and, at the same time, aerodynamic.", "xt": "그 설계는 안전하면서 동시에 공기역학적이어야 한다."}]}, {"t": "8. 정도 · 강조 부사 — 문장의 세기를 조절하는 말", "g": "선택지의 정답·오답을 가르는 것은 대개 이런 부사 하나입니다. always·never·only가 붙은 선지는 특히 의심하세요.", "r": [{"e": "indeed", "m": "실제로, 정말로", "n": "앞 주장을 강하게 뒷받침", "s": "9월 29번", "x": "Indeed, a leader's failure to empathize is a main reason workers leave.", "xt": "실제로, 공감하지 못하는 지도자의 실패는 직원이 떠나는 주된 이유이다."}, {"e": "in fact", "m": "사실은", "n": "앞 통념을 뒤집을 때가 많다", "s": "6월 21·41-42번", "x": "In fact, at room temperature glass never behaves as a liquid.", "xt": "사실 상온에서 유리는 결코 액체처럼 움직이지 않는다."}, {"e": "particularly / especially", "m": "특히", "n": "", "s": "6월 24·30번, 9월 37번", "x": "particularly in the UK, the growth of tour operators changed the industry", "xt": "특히 영국에서 여행사의 성장이 그 산업을 바꾸었다"}, {"e": "critically", "m": "결정적으로, 중요하게도", "n": "", "s": "9월 23번", "x": "Critically, dopamine rewards the process, not just the finished result.", "xt": "결정적으로, 도파민은 완성된 결과만이 아니라 과정에 보상한다."}, {"e": "essentially", "m": "본질적으로", "n": "", "s": "6월 21·24번", "x": "The industry moved from essentially individual activities to integrated ones.", "xt": "그 산업은 본질적으로 개별적이던 활동에서 통합된 활동으로 옮겨 갔다."}, {"e": "largely", "m": "주로, 대체로", "n": "", "s": "6월 24번", "x": "Hotels were largely in the business of selling bed nights.", "xt": "호텔은 주로 숙박을 파는 사업을 하고 있었다."}, {"e": "primarily", "m": "주로, 무엇보다", "n": "", "s": "9월 40번", "x": "Some refer to visibility as the primary function of lighting.", "xt": "어떤 이들은 가시성을 조명의 주된 기능이라고 부른다."}, {"e": "generally", "m": "일반적으로", "n": "", "s": "6월 41-42번, 9월 32번", "x": "Our enjoyment of being tickled generally diminishes as we age.", "xt": "간지럼을 타는 즐거움은 나이가 들면서 대체로 줄어든다."}, {"e": "rarely / seldom", "m": "좀처럼 ~않다", "n": "부정어. 문두에 오면 도치", "s": "6월 35번", "x": "the injuries they sustain are rarely serious", "xt": "그들이 입는 부상은 좀처럼 심각하지 않다"}, {"e": "merely", "m": "단지 ~일 뿐", "n": "not merely A but also B", "s": "9월 31번", "x": "Belonging was not merely a matter of safety but also of survival.", "xt": "소속은 단지 안전의 문제가 아니라 생존의 문제이기도 했다."}, {"e": "relatively", "m": "비교적", "n": "", "s": "6월 35번", "x": "the damage they can do through a relatively innocuous accident", "xt": "비교적 무해한 사고로도 그들이 입을 수 있는 손상"}, {"e": "apparently / seemingly", "m": "겉보기에는 (실제와 다를 수 있음)", "n": "apparently random data", "s": "9월 21번", "x": "examining apparently random data to find regularity", "xt": "무작위로 보이는 데이터를 조사해 규칙성을 찾는 것"}, {"e": "considerable / substantial", "m": "상당한", "n": "", "s": "6월 23번", "x": "Large animals may have a considerable opportunity to learn.", "xt": "큰 동물은 배울 기회가 상당히 많을 수 있다."}, {"e": "hardly / scarcely / barely", "m": "거의 ~않다", "n": "not이 없어도 부정문", "s": "추가", "x": "There was hardly any evidence for the claim.", "xt": "그 주장에 대한 증거는 거의 없었다."}, {"e": "virtually", "m": "사실상, 거의", "n": "", "s": "추가", "x": "Virtually every passenger brought an ID card.", "xt": "사실상 모든 승객이 신분증을 지참했다."}, {"e": "arguably", "m": "아마 틀림없이", "n": "필자의 조심스러운 단정", "s": "추가", "x": "Autocomplete is arguably the clearest mirror of public interest.", "xt": "자동완성은 아마 틀림없이 대중의 관심을 가장 분명히 비추는 거울이다."}, {"e": "presumably", "m": "아마도", "n": "", "s": "추가", "x": "The delay was presumably caused by the electrical issues.", "xt": "그 지연은 아마도 전기 문제로 인한 것이었을 테다."}, {"e": "markedly / significantly", "m": "현저히", "n": "", "s": "추가", "x": "Participation rose markedly when the seats were reassigned.", "xt": "좌석을 재배치하자 참여도가 현저히 올라갔다."}, {"e": "by far", "m": "단연코", "n": "최상급·비교급 강조", "s": "추가", "x": "This is by far the most difficult issue in composition.", "xt": "이것은 작곡에서 단연코 가장 어려운 문제이다."}, {"e": "all the more", "m": "그만큼 더", "n": "", "s": "추가", "x": "The result is all the more surprising because the sample was small.", "xt": "표본이 작았기에 그 결과는 그만큼 더 놀랍다."}]}, {"t": "9. 비교 · 범위 한정", "g": "무엇과 무엇을 비교하는지(비교 대상)를 놓치면 도표·요약문 문제에서 바로 틀립니다.", "r": [{"e": "in comparison (to const ITEMS = DB.items;
const KEY = 'suneung-vocab-v2';
const K = it => it.w.toLowerCase();
let prog = {}, star = {};
let state = {mode:'list', exam:'전체', area:'전체', only:'전체', apx:'전체', day:0, tag:null, q:'', reveal:false};
let deck = [], di = 0, shown = false, quizQ = null, answered = false;

/* Claude 앱 안에서는 window.storage, 그 밖(깃허브 등)에서는 localStorage */
const store = {
  async get(k){
    if(window.storage && window.storage.get){
      try{ const r = await window.storage.get(k); if(r && r.value) return r.value; }catch(e){}
    }
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k, v){
    if(window.storage && window.storage.set){
      try{ await window.storage.set(k, v); }catch(e){}
    }
    try{ localStorage.setItem(k, v); }catch(e){}
  }
};

let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ store.set(KEY, JSON.stringify({p:prog, s:star})); }, 400);
}
async function load(){
  try{
    const v = await store.get(KEY);
    if(v){
      const d = JSON.parse(v);
      if(d && d.p){ prog = d.p||{}; star = d.s||{}; }
      else { prog = d||{}; }        // 예전 저장본 이어받기
    }
  }catch(e){ prog = {}; star = {}; }
}

const TAGS = ['핵심','필수','추가','선지','듣기표현','다의어','고빈출'];
function filtered(){
  const q = state.q.trim().toLowerCase();
  return ITEMS.filter(it=>{
    if(state.day && it.d!==state.day) return false;
    if(state.exam!=='전체' && !it.es.includes(state.exam)) return false;
    if(state.area!=='전체' && !it.as.includes(state.area)) return false;
    if(state.tag && !it.t.includes(state.tag)) return false;
    if(state.only==='미암기' && (prog[K(it)]||0)>=3) return false;
    if(state.only==='완료' && (prog[K(it)]||0)<3) return false;
    if(state.only==='★ 별표' && !star[K(it)]) return false;
    if(q && !(it.w.toLowerCase().includes(q) || it.m.includes(q)
              || it.ex.some(e=>e.ch.toLowerCase().includes(q) || e.tr.includes(q)))) return false;
    return true;
  });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function starBtn(it, cls){
  const on = !!star[K(it)];
  return `<button class="star ${on?'on':''} ${cls||''}" data-star="${it.i}"
    aria-pressed="${on}" aria-label="${esc(it.w)} 별표">${on?'★':'☆'}</button>`;
}

function meter(){
  const pool = state.day ? ITEMS.filter(x=>x.d===state.day) : ITEMS;
  const done = pool.filter(it=>(prog[K(it)]||0)>=3).length;
  mDone.textContent = done; mAll.textContent = pool.length;
  mLabel.textContent = state.day ? ('Day '+state.day+' ') : '';
  mStar.textContent = Object.values(star).filter(Boolean).length;
  mBar.style.width = (done/Math.max(1,pool.length)*100)+'%';
}

function dayDone(d){
  const p = ITEMS.filter(x=>x.d===d);
  return p.filter(x=>(prog[K(x)]||0)>=3).length;
}
function daySelect(){
  let o = `<option value="0"${state.day?'':' selected'}>전체 ${ITEMS.length}개</option>`;
  for(let d=1; d<=DB.days; d++){
    const n = ITEMS.filter(x=>x.d===d).length, done = dayDone(d);
    o += `<option value="${d}"${state.day===d?' selected':''}>Day ${d} — ${done}/${n}${done===n?' ✓':''}</option>`;
  }
  return `<select id="daySel" aria-label="Day 선택">${o}</select>`;
}

function controls(extra){
  const seg = (name,vals)=>'<div class="seg" role="group">'+vals.map(v=>
    `<button data-f="${name}" data-v="${v}" aria-pressed="${state[name]===v}">${v}</button>`).join('')+'</div>';
  return `<div class="controls">
    ${daySelect()}
    <button class="chip" id="dayPrev">◀</button>
    <button class="chip" id="dayNext">▶</button>
  </div>
  <div class="controls">
    ${seg('exam',['전체','6월','9월','수능','고빈출'])}
    ${seg('area',['전체','듣기','독해','어휘'])}
    <input type="search" id="q" placeholder="단어·뜻·해석 검색" value="${esc(state.q)}">
  </div>
  <div class="controls">
    ${seg('only',['전체','미암기','완료','★ 별표'])}
    ${extra||''}
  </div>
  <div class="controls">
    ${TAGS.map(t=>`<button class="chip" data-tag="${t}" aria-pressed="${state.tag===t}">${t}</button>`).join('')}
  </div>`;
}

function render(){
  const list = filtered();
  if(state.mode==='list') panel.innerHTML = viewList(list);
  else if(state.mode==='card') panel.innerHTML = viewCard(list);
  else if(state.mode==='quiz') panel.innerHTML = viewQuiz(list);
  else if(state.mode==='apx') panel.innerHTML = viewApx();
  else if(state.mode==='sheet') panel.innerHTML = viewSheet(list);
  else panel.innerHTML = viewPoly();
  meter();
}

function viewList(list){
  const rev = `<button class="chip" id="revealAll" aria-pressed="${state.reveal}">뜻·해석 모두 보기</button>`;
  if(!list.length) return controls(rev)+'<p class="empty">조건에 맞는 단어가 없습니다. 필터를 넓혀 보세요.</p>';
  const h = state.reveal?'':'hide';
  const rows = list.map((it,n)=>{
    const lv = prog[K(it)]||0;
    const dots = [1,2,3].map(k=>`<button class="dot ${lv>=k?'on':''}" data-mark="${it.i}" data-lv="${k}"
       aria-label="${esc(it.w)} ${k}회독" title="${k}회독"></button>`).join('');
    return `<tr class="row"><td class="tdnum">${n+1}</td><td>
      <span class="word">${esc(it.w)}</span><span class="pos">${esc(it.p)}</span>
      <div class="mask mean ${h}" data-peek>${esc(it.m)}</div>
      ${it.ex.map(e=>`<div class="exwrap">
        <div class="chunk">${e.ch}</div>
        <div class="mask tr ${h}" data-peek>${esc(e.tr)}</div>
        <div class="src">${esc(e.s)}</div></div>`).join('')}
      <div class="src"><span class="tg">${it.t.map(esc).join(' / ')}</span></div>
    </td><td class="omr">${starBtn(it)}${dots}</td></tr>`;
  }).join('');
  return controls(rev)+`<p class="count"><b>${list.length}</b>개 · 밑줄이 표제어, 영문 아래가 해석입니다.
    ☆를 누르면 별표 단어로 모입니다.</p><table><tbody>${rows}</tbody></table>`;
}

function viewCard(list){
  if(!list.length) return controls()+'<p class="empty">조건에 맞는 단어가 없습니다.</p>';
  if(!deck.length || deck.some(i=>!list.find(x=>x.i===i))){ deck = list.map(x=>x.i); di=0; shown=false; }
  const it = ITEMS[deck[Math.min(di,deck.length-1)]];
  const lv = prog[K(it)]||0, h = shown?'':'hide';
  return controls()+`<div class="card">
    <div class="no">${esc(it.es.join('/'))} ${esc(it.as.join('/'))}</div>
    <div class="tag">${it.t.map(esc).join(' / ')}</div>
    ${starBtn(it)}
    <div class="cw">${esc(it.w)}</div>
    <div class="cp">${esc(it.p)}</div>
    ${it.ex.map(e=>`<div class="cc">${e.ch}</div>
      <div class="ct ${h}">${esc(e.tr)}</div>
      <div class="csrc">${esc(e.s)}</div>`).join('')}
    <div class="cm ${h}">${esc(it.m)}</div>
    <div class="cbtns">
      ${shown
        ? `<button class="warn" data-card="again">다시 볼래요</button>
           <button class="solid" data-card="know">외웠어요</button>`
        : `<button class="solid" data-card="flip" style="flex:2">뜻·해석 확인</button>
           <button data-card="skip">건너뛰기</button>`}
    </div>
    <div class="cstat">Day ${it.d} · ${di+1} / ${deck.length} · 현재 ${lv}회독${star[K(it)]?' · ★ 별표':''}</div>
  </div>`;
}

function makeQ(list){
  const pool = list.filter(x=>(prog[K(x)]||0)<3);
  const src = pool.length? pool : list;
  const it = src[Math.floor(Math.random()*src.length)];
  const others = ITEMS.filter(x=>x.i!==it.i && x.as.some(a=>it.as.includes(a)));
  const picks = [];
  let guard = 0;
  while(picks.length<3 && others.length && guard++<200){
    const c = others[Math.floor(Math.random()*others.length)];
    if(!picks.find(p=>p.i===c.i) && c.m!==it.m) picks.push(c);
  }
  return {it, opts:[it,...picks].sort(()=>Math.random()-.5)};
}
function viewQuiz(list){
  if(list.length<4) return controls()+'<p class="empty">시험 모드는 단어가 4개 이상일 때 쓸 수 있습니다. 필터를 넓혀 보세요.</p>';
  if(!quizQ || !list.find(x=>x.i===quizQ.it.i)){ quizQ = makeQ(list); answered=false; }
  const {it,opts} = quizQ;
  return controls()+`<div class="card">
    <div class="no">${esc(it.ex[0].s)}</div>
    ${starBtn(it)}
    <div class="cw">${esc(it.w)}</div>
    <div class="cp">${esc(it.p)}</div>
    <div class="cc">${answered? it.ex[0].ch : '뜻으로 알맞은 것을 고르시오.'}</div>
    <div class="ct">${answered? esc(it.ex[0].tr) : ''}</div>
    ${opts.map((o,k)=>`<button class="opt" data-opt="${o.i}"><span class="n">${'①②③④'[k]}</span>${esc(o.m)}</button>`).join('')}
    <div class="cbtns" style="${answered?'':'display:none'}">
      <button class="solid" data-quiz="next">다음 문제</button>
    </div>
  </div>`;
}

function viewPoly(){
  const h = state.reveal?'':'hide';
  let out = `<div class="controls">
     <button class="chip" id="revealAll" aria-pressed="${state.reveal}">뜻 모두 보기</button>
   </div>
   <p class="count">시험에 <b>두 번 이상</b> 나왔거나 고빈출 목록과 겹친 단어를 자동으로 모았습니다.
   뜻은 가림판으로 덮여 있습니다.</p>`;
  DB.rep.forEach(sec=>{
    if(!sec.r.length) return;
    out += `<div class="grp"><h3>${esc(sec.t)} <span class="cnt">${sec.n}개</span></h3>
            <p class="gd">${esc(sec.g)}</p>` +
      sec.r.map(r=>`<div class="ax">
        <div class="axh"><span class="exp">${esc(r.w)} <span class="pos">${esc(r.p)}</span></span>
          <span class="badges">${r.poly?'<span class="hit">다의어</span>':''}
            ${r.hot?'<span class="new">고빈출 400</span>':''}</span></div>
        <div class="mask axm ${h}" data-peek>${esc(r.m)}</div>
        ${(r.ex||[]).map(e=>`<div class="exwrap">
            <div class="chunk">${e.ch}</div>
            <div class="mask tr ${h}" data-peek>${esc(e.tr)}</div>
            <div class="src">${esc(e.s)}</div></div>`).join('')}
        ${r.ex?'':`<div class="src">${r.src.map(esc).join(' · ')}</div>`}
        ${r.note?`<div class="axn">${esc(r.note)}</div>`:''}
      </div>`).join('') + '</div>';
  });
  return out;
}

/* ── 무작위 시험지 (단어 40 + 부록 5) ── */
let sheet = null, sheetKey = '', sheetNo = 0, showAns = false;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function apxFlat(){ return DB.apx.reduce((a,g)=>a.concat(g.r),[]); }
function buildSheets(list, force){
  const key = [state.exam,state.area,state.only,state.tag,state.q].join('|');
  if(!force && sheet && sheetKey===key) return;
  sheetKey = key; sheetNo = 0;
  sheet = { w: shuffle(list.map(x=>x.i)), x: shuffle(apxFlat().slice()) };
}
function viewSheet(list){
  if(list.length < 5) return controls()+'<p class="empty">시험지를 만들려면 단어가 더 필요합니다. 필터를 넓혀 보세요.</p>';
  buildSheets(list);
  const total = Math.max(1, Math.ceil(sheet.w.length/40));
  if(sheetNo >= total) sheetNo = 0;
  const ws = sheet.w.slice(sheetNo*40, sheetNo*40+40).map(i=>ITEMS[i]);
  const ax = [];
  for(let k=0;k<5;k++) ax.push(sheet.x[(sheetNo*5+k) % sheet.x.length]);

  const rows = [];
  const half = Math.ceil(ws.length/2);
  ws.slice(0,half).forEach(it=>rows.push({t:'w', it}));
  ax.forEach(a=>rows.push({t:'x', a}));
  ws.slice(half).forEach(it=>rows.push({t:'w', it}));

  const body = rows.map((r,n)=>{
    const num = `<span class="qn">${n+1}.</span>`;
    if(r.t==='w') return `<div class="q"><div class="qt">${num}
      <span class="qw">${esc(r.it.w)}</span> <span class="pos">${esc(r.it.p)}</span>
      <span class="qs">${esc(r.it.ex[0].s)}</span></div><div class="ql"></div></div>`;
    return `<div class="q ax-q"><div class="qt">${num}
      <span class="qw">${esc(r.a.e)}</span> <span class="pos">부록</span></div><div class="ql"></div></div>`;
  }).join('');

  const ans = rows.map((r,n)=>
    `<span class="an"><b>${n+1}</b> ${esc(r.t==='w'? r.it.m : r.a.m)}</span>`).join('');

  const nav = `<div class="controls noprint">
    <div class="seg"><button data-sheet="prev">◀ 이전</button>
      <button data-sheet="next">다음 ▶</button></div>
    <button class="chip" data-sheet="shuffle">다시 섞기</button>
    <button class="chip" data-sheet="printq">시험지만 인쇄</button>
    <button class="chip" data-sheet="printa">정답지만 인쇄</button>
    <button class="chip" data-sheet="printall">둘 다 인쇄</button>
  </div>`;

  return controls()+nav+`<div class="sheet">
    <div class="sh">
      <div class="sht">${state.day? ('Day '+state.day+' 단어 시험지') : '무작위 단어 시험지'}
        <span>${state.day? '' : '세트 '+(sheetNo+1)+' / '+total}</span></div>
      <div class="shs">단어 ${ws.length}문항 + 부록(연결사·부사·전치사) ${ax.length}문항 · 총 ${rows.length}문항
        &nbsp;|&nbsp; 이름 ______________ 점수 ______ / ${rows.length}</div>
    </div>
    <div class="qs-wrap">${body}</div>
  </div>
  <div class="ansbox">
    <div class="sh">
      <div class="sht">정답지 <span>${state.day? ('Day '+state.day) : '세트 '+(sheetNo+1)+' / '+total}</span></div>
      <div class="shs">${state.day? ('Day '+state.day) : ('세트 '+(sheetNo+1))} 정답 · 총 ${rows.length}문항 — 잘라서 따로 보관하세요.</div>
    </div>
    <div class="ansgrid">${ans}</div>
  </div>`;
}

function viewApx(){
  const seg = ['전체','이번 시험','추가'].map(v=>
    `<button data-f="apx" data-v="${v}" aria-pressed="${state.apx===v}">${v}</button>`).join('');
  const h = state.reveal?'':'hide';
  let out = `<div class="controls"><div class="seg" role="group">${seg}</div>
    <input type="search" id="q" placeholder="표현 검색" value="${esc(state.q)}"></div>
    <div class="controls">
      <button class="chip" id="revealAll" aria-pressed="${state.reveal}">뜻·해석 모두 보기</button>
    </div>
    <p class="count">독해용 연결사·부사·전치사 <b>${DB.apx.reduce((a,g)=>a+g.r.length,0)}</b>개 ·
    <span class="hit">붉은 표시</span>는 이번 6월·9월에 실제로 나온 것, 회색은 본시험 대비 추가분입니다.
    뜻과 예문 해석은 가림판으로 덮여 있습니다 — 눌러서 확인하세요.</p>`;
  const q = state.q.trim().toLowerCase();
  let hit = 0;
  DB.apx.forEach(g=>{
    const rows = g.r.filter(r=>{
      if(state.apx==='이번 시험' && r.s==='추가') return false;
      if(state.apx==='추가' && r.s!=='추가') return false;
      if(q && !(r.e.toLowerCase().includes(q) || r.m.includes(q) || r.n.includes(q)
                || r.x.toLowerCase().includes(q) || r.xt.includes(q))) return false;
      return true;
    });
    if(!rows.length) return;
    hit += rows.length;
    out += `<div class="grp"><h3>${esc(g.t)}</h3><p class="gd">${esc(g.g)}</p>` +
      rows.map(r=>`<div class="ax">
        <div class="axh"><span class="exp">${esc(r.e)}</span>
          <span class="${r.s==='추가'?'new':'hit'}">${r.s==='추가'?'본시험 대비':esc(r.s)}</span></div>
        <div class="mask axm ${h}" data-peek>${esc(r.m)}</div>
        <div class="axe">${esc(r.x)}</div>
        <div class="mask axt ${h}" data-peek>${esc(r.xt)}</div>
        ${r.n?`<div class="axn">${esc(r.n)}</div>`:''}
      </div>`).join('') + '</div>';
  });
  if(!hit) out += '<p class="empty">해당하는 표현이 없습니다.</p>';
  return out;
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button, [data-peek]');
  if(!t) return;

  if(t.dataset.mode){ state.mode = t.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed', b===t));
    render(); return; }
  if(t.dataset.f){ state[t.dataset.f] = t.dataset.v; deck=[]; quizQ=null; render(); return; }
  if(t.dataset.tag){ state.tag = state.tag===t.dataset.tag? null : t.dataset.tag; deck=[]; quizQ=null; render(); return; }
  if(t.id==='revealAll'){ state.reveal = !state.reveal; render(); return; }
  if(t.id==='dayPrev' || t.id==='dayNext'){
    const step = t.id==='dayNext' ? 1 : -1;
    state.day = Math.min(DB.days, Math.max(0, (state.day||0) + step));
    deck=[]; quizQ=null; sheet=null; render(); return;
  }

  if(t.dataset.star!==undefined){
    const key = K(ITEMS[+t.dataset.star]);
    if(star[key]) delete star[key]; else star[key] = 1;
    save();
    if(state.only==='★ 별표'){ render(); }
    else { t.classList.toggle('on'); t.textContent = star[key]?'★':'☆';
           t.setAttribute('aria-pressed', !!star[key]); meter(); }
    return;
  }
  if(t.hasAttribute('data-peek')){ t.classList.toggle('hide'); return; }

  if(t.dataset.mark){
    const key = K(ITEMS[+t.dataset.mark]), lv = +t.dataset.lv;
    prog[key] = (prog[key]||0)===lv ? lv-1 : lv;
    save(); render(); return;
  }
  if(t.dataset.card){
    const it = ITEMS[deck[di]], a = t.dataset.card;
    if(a==='flip') shown = true;
    else if(a==='know'){ prog[K(it)] = Math.min(3,(prog[K(it)]||0)+1); save(); next(); }
    else if(a==='again'){ prog[K(it)] = 0; save(); deck.push(it.i); next(); }
    else next();
    render(); return;
  }
  if(t.dataset.opt!==undefined && !answered){
    answered = true;
    const pick = +t.dataset.opt, it = quizQ.it;
    document.querySelectorAll('.opt').forEach(b=>{
      if(+b.dataset.opt===it.i) b.classList.add('right');
      else if(+b.dataset.opt===pick) b.classList.add('wrong');
    });
    if(pick===it.i) prog[K(it)] = Math.min(3,(prog[K(it)]||0)+1);
    else { prog[K(it)] = 0; star[K(it)] = 1; }   // 틀린 단어는 자동으로 별표
    save(); meter();
    document.querySelector('.cc').innerHTML = it.ex[0].ch;
    document.querySelector('.ct').textContent = it.ex[0].tr;
    const s = document.querySelector('.card .star');
    if(s && star[K(it)]){ s.classList.add('on'); s.textContent='★'; }
    document.querySelector('[data-quiz]').parentElement.style.display='flex';
    return;
  }
  if(t.dataset.sheet){
    const a = t.dataset.sheet;
    if(a.startsWith('print')){
      const cls = a==='printq' ? 'pq' : (a==='printa' ? 'pa' : '');
      if(cls) document.body.classList.add(cls);
      window.print();
      setTimeout(()=>document.body.classList.remove('pq','pa'), 500);
      return;
    }
    if(a==='shuffle'){ buildSheets(filtered(), true); }
    else if(a==='next') sheetNo++;
    else if(a==='prev') sheetNo = Math.max(0, sheetNo-1);
    render(); return;
  }
  if(t.dataset.quiz==='next'){ quizQ = makeQ(filtered()); answered=false; render(); return; }
  if(t.id==='reset'){
    if(confirm('회독 기록과 별표를 모두 지울까요? 되돌릴 수 없습니다.')){
      prog = {}; star = {}; save(); deck=[]; quizQ=null; render();
    }
    return;
  }
});
function next(){ di++; shown=false; if(di>=deck.length) di=0; }

document.addEventListener('change', e=>{
  if(e.target.id==='daySel'){
    state.day = +e.target.value; deck=[]; quizQ=null; sheet=null; render();
  }
});

document.addEventListener('input', e=>{
  if(e.target.id==='q'){
    state.q = e.target.value; deck=[]; quizQ=null;
    render();
    const el = document.getElementById('q');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
});

load().then(render);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
